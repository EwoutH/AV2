stages:
    - test

variables:
    DAV2D_REPO:
        value: ""
        description: "dav2d repository to test against instead of videolan/dav2d main, e.g. a fork"
    DAV2D_REF:
        value: "main"
        description: "Branch or commit of DAV2D_REPO to test against"
    SANITIZER:
        value: "none"
        description: "Sanitizer to use, if any"

.test-common:
    stage: test
    cache:
        key: dav2d.git-20261113
        paths:
            - cache/dav2d.git/
    before_script:
        - test -d cache || mkdir cache
        - test -d cache/dav2d.git && GIT_DIR=cache/dav2d.git git fetch --refmap=refs/heads/main:refs/heads/main origin main
        - test -d cache/dav2d.git || git clone --bare https://code.videolan.org/videolan/dav2d.git cache/dav2d.git
        - git clone cache/dav2d.git dav2d
        - if [ -n "$DAV2D_REPO" ]; then git -C dav2d fetch "$DAV2D_REPO" "$DAV2D_REF" && git -C dav2d checkout -q FETCH_HEAD; fi
        - git -C dav2d describe --always --long
        - ln -sf $(pwd) dav2d/tests/dav2d-test-data
    script:
        - meson setup build dav2d --buildtype release
                                  -Dtestdata_tests=true
                                  -Dlogging=false
                                  -Dtrim_dsp=false
                                  -Db_sanitize=$SANITIZER
        - ninja -C build
        - cd build && time meson test -v --suite testdata
        - time meson test -v --suite testdata --test-args "--cpumask 0" --logbase testlog-c
        - time meson test -v --suite testdata --test-args "--threads 4 --framedelay 4" --logbase testlog-mt
    dependencies: []
    artifacts:
        when: always
        reports:
            junit: build/meson-logs/testlog*.junit.xml

test-debian:
    extends: .test-common
    image: registry.videolan.org/dav1d-debian-unstable:20260622120900
    tags:
        - docker
        - amd64

test-debian-asan:
    extends: .test-common
    image: registry.videolan.org/dav1d-debian-unstable:20260622120900
    tags:
        - docker
        - amd64
    variables:
        ASAN_OPTIONS: 'detect_leaks=0'
        SANITIZER: "address"

test-debian-ubsan:
    extends: .test-common
    image: registry.videolan.org/dav1d-debian-unstable:20260622120900
    tags:
        - docker
        - amd64
    variables:
        UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
        SANITIZER: "undefined"

test-debian-msan:
    extends: .test-common
    image: registry.videolan.org/dav1d-debian-unstable:20260622120900
    tags:
        - docker
        - amd64
    variables:
        SANITIZER: "memory"
        MSAN_OPTIONS: 'exitcode=1'
        CC: clang
    script:
        - meson setup build dav2d --buildtype debugoptimized
                                  -Dtestdata_tests=true
                                  -Denable_seek_stress=true
                                  -Dlogging=false
                                  -Db_sanitize=memory
                                  -Db_lundef=false
                                  -Denable_asm=false
        - ninja -C build
        - cd build
        - exit_code=0
        - time meson test -v --setup=sanitizer --suite testdata || exit_code=$((exit_code + $?))
        - if [ $exit_code -ne 0 ]; then exit $exit_code; fi

test-debian-tsan:
    extends: .test-common
    image: registry.videolan.org/dav1d-debian-unstable:20260622120900
    tags:
        - docker
        - amd64
    variables:
        TSAN_OPTIONS: 'halt_on_error=1'
        SANITIZER: "thread"
    script:
        - meson setup build dav2d --buildtype release
                                  -Dtestdata_tests=true
                                  -Dlogging=false
                                  -Dtrim_dsp=false
                                  -Db_sanitize=thread
        - ninja -C build
        - cd build
        - exit_code=0
        - time meson test -v --setup=sanitizer --suite testdata --test-args "--threads 2 --framedelay 1" || exit_code=$((exit_code + $?))
        - time meson test -v --setup=sanitizer --suite testdata --test-args "--threads 2 --framedelay 2" || exit_code=$((exit_code + $?))
        - time meson test -v --setup=sanitizer --suite testdata --test-args "--threads 4 --framedelay 4" || exit_code=$((exit_code + $?))
        - if [ $exit_code -ne 0 ]; then exit $exit_code; fi

test-debian-aarch64:
    extends: .test-common
    image: registry.videolan.org/dav1d-debian-bookworm-aarch64:20260228141555
    tags:
        - docker
        - aarch64

test-debian-ppc64le:
    extends: .test-common
    image: registry.videolan.org/dav1d-debian-unstable-ppc64le:20260210052452
    tags:
        - docker
        - ppc64le
    variables:
        CC: gcc-13

test-debian-armv7-clang-5:
    extends: .test-common
    image: registry.videolan.org/dav1d-debian-bookworm-armv7:20260217211228
    tags:
        - docker
        - armv7
    variables:
        CC: clang-5.0
        CFLAGS: '-integrated-as'
    script:
        - linux32 meson setup build dav2d --buildtype release
                                          -Dtestdata_tests=true
                                          -Dlogging=false
                                          -Dtrim_dsp=false
        - ninja -C build
        - cd build && time meson test -v --suite testdata
        - time meson test -v --suite testdata --test-args "--cpumask 0" --logbase testlog-c

test-avmdec:
    stage: test
    image: registry.videolan.org/vlc-debian-unstable:20260908103441
    tags:
        - docker
        - amd64
    variables:
        AVM_REF: av2-normative
    script:
        - git clone -b "$AVM_REF" --depth 1 https://github.com/AOMediaCodec/avm avm-src
        - git -C avm-src log -1 --format='%H %s'
        - cmake -S avm-src -B avm-build -DAVM_TARGET_CPU=x86_64 -DENABLE_TESTS=0 -DCONFIG_AV2_ENCODER=0
            -DCONFIG_TESTONLY_12BIT_SUPPORT=1
        - make -C avm-build -j$(nproc) avmdec
        - |
          grep -HoE "files\('[^']+'\), '[0-9a-f]{32}'" */meson.build |
              sed -E "s|^([^/]+)/meson.build:files\('([^']+)'\), '([0-9a-f]+)'|\1/\2 \3|" > expected.txt
          test -s expected.txt
          fail=0
          while read -r file md5; do
              got=$(avm-build/avmdec --md5 --rawvideo "$file" | cut -d' ' -f1)
              if [ "$got" = "$md5" ]; then
                  echo "ok   $file"
              else
                  echo "FAIL $file: avmdec $got, meson.build $md5"
                  fail=1
              fi
          done < expected.txt
          exit $fail

check-samples-listed:
    stage: test
    image: registry.videolan.org/dav1d-debian-unstable:20260622120900
    tags:
        - docker
        - amd64
    script:
        - |
          fail=0
          for f in */*.obu; do
              if ! grep -qF "'$(basename "$f")'" "$(dirname "$f")/meson.build"; then
                  echo "not in $(dirname "$f")/meson.build: $f"
                  fail=1
              fi
          done
          exit $fail
